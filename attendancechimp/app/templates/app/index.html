<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application. Upload QR code images to recorrd attendance.</p>
    <p> 
        <b>{{ name }}</b>
    </p>
    <p> Current Time: {{ current_time }}</p>
    <hr>
    {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Log Out</button>
    </form>
    {% else %}
        <a href="{% url 'login' %}">Log In</a>
        {% endif %}

</div>
</body>
</html>
